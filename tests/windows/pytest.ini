[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --tb=short
    --strict-markers
    -W ignore::DeprecationWarning
log_cli = true
log_cli_level = INFO
log_cli_format = %(message)s

markers =
    cpp: C++ executable tests
    python_script: Python example script tests
    pybinding: dx_postprocess pybinding tests
    invalid_args: Invalid argument handling tests
    missing_file: Missing file path tests
    smoke: Quick smoke tests (subset for CI)
